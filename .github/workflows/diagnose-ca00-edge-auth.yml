name: diagnose-ca00-edge-auth

on:
  push:
    paths:
      - ".github/workflows/diagnose-ca00-edge-auth.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production authentication path
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          api = os.environ["CLIPPER_API_URL"].rstrip("/")
          worker = os.environ["CLIPPER_WORKER_TOKEN"]
          request = urllib.request.Request(
              f"{api}/api/campaign-intelligence",
              headers={
                  "authorization": f"Bearer {worker}",
                  "x-worker-token": worker,
                  "x-github-token": os.environ["GITHUB_TOKEN"],
                  "user-agent": "ca00-edge-auth-diagnostic/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("HTTP_STATUS=" + str(response.status))
                  print("RESPONSE_HEADERS=" + repr(dict(response.headers.items())))
                  print("RESPONSE_BODY=" + response.read().decode("utf-8", "replace")[:4000])
          except urllib.error.HTTPError as exc:
              print("HTTP_STATUS=" + str(exc.code))
              print("RESPONSE_HEADERS=" + repr(dict(exc.headers.items())))
              body = exc.read().decode("utf-8", "replace")
              print("RESPONSE_BODY=" + body[:4000])
              raise SystemExit(1)
          PY