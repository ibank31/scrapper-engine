name: campaign-sync-ai

on:
  schedule:
    # GitHub cron is UTC: 17:00 UTC = 00:00 WIB, once per day.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force_ai:
        description: "Re-run Gemini analysis even when rules_hash is unchanged"
        required: false
        type: boolean
        default: false

concurrency:
  group: campaign-sync-ai
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Select daily Gemini model
        shell: bash
        run: |
          set -euo pipefail
          models=(
            gemini-2.5-flash
            gemini-2.5-flash-lite
            gemini-3-flash
            gemini-3.1-flash-lite
            gemini-3.5-flash
            gemini-3.5-flash-lite
            gemini-3.6-flash
            gemini-3.7-flash
            gemini-3.8-flash
          )
          day=$(( $(date -u +%s) / 86400 ))
          index=$(( day % ${#models[@]} ))
          echo "GEMINI_MODEL=${models[$index]}" >> "$GITHUB_ENV"
          echo "Selected daily Gemini model: ${models[$index]}"

      - name: Scrape, understand rules, score and sync campaigns
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIPPER_AI_BATCH_SIZE: "2"
          CLIPPER_FORCE_AI: ${{ inputs.force_ai || false }}
        run: python worker/sync_campaigns.py
