name: campaign-sync-ai

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: campaign-sync-ai
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ~/.cache/scrapper-engine
          key: scrapper-qwen3-4b-instruct-2507-q4km-v1

      - name: Install scraper dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install free local AI runtime
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
        run: pip install -r requirements-ai.txt

      - name: Scrape, understand rules, score and sync campaigns
        env:
          CLIPPER_API_URL: \${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: \${{ secrets.CLIPPER_WORKER_TOKEN }}
        run: python worker/sync_campaigns.py
