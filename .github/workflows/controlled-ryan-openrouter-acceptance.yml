# Bounded production acceptance for the campaign-intelligence chain.
name: ca01-controlled-ryan-acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/controlled-ryan-openrouter-acceptance.yml"
      - "core/campaign_ai.py"
      - "core/campaign_brain.py"
      - "core/campaign_critic.py"
      - "core/campaign_reconciliation.py"
      - "core/campaign_evidence.py"
      - "worker/sync_campaigns.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLIPPER_CAMPAIGN_IDS: "926e1b7f-1030-4333-a557-f99d9f891437"
      CLIPPER_FORCE_AI: "1"
      CLIPPER_AI_BATCH_SIZE: "2"
      CLIPPER_AUTO_QUEUE: "0"
      GEMINI_MODEL: "__openrouter_fallback_test__"
      OPENROUTER_MAX_RETRIES: "1"
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Targeted Ryan production re-analysis
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python worker/sync_campaigns.py

      - name: Verify persisted acceptance contract
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["CLIPPER_API_URL"].rstrip("/")
          campaign_id = "926e1b7f-1030-4333-a557-f99d9f891437"
          worker_token = os.environ["CLIPPER_WORKER_TOKEN"]
          request = urllib.request.Request(
              f"{api}/api/campaign-intelligence",
              headers={
                  "authorization": f"Bearer {worker_token}",
                  "x-worker-token": worker_token,
                  "x-github-token": os.environ["GITHUB_TOKEN"],
                  "user-agent": "scrapper-engine-acceptance/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          campaign = next(
              item for item in payload["campaigns"]
              if item["id"] == campaign_id
          )
          ai = json.loads(campaign["ai_rules_json"])

          assert ai["schema_version"] == 2
          assert ai["source_hash"]
          brain = ai["campaign_brain"]
          assert brain["schema_version"] == 1
          assert brain["brain_id"].startswith("brain-v1:")
          assert brain["source_hash"] == ai["source_hash"]
          assert isinstance(brain["rules"], list)
          assert brain["evidence"]["coverage"] == 1.0
          brain_cta = next(
              rule for rule in brain["rules"]
              if rule["source_rule_path"] == "rules.cta_text"
          )
          assert brain_cta["value"] == "Follow and meet Ryan for more @....."
          assert brain_cta["evidence_ids"]
          critic = ai["campaign_critic"]
          assert critic["schema_version"] == 1
          assert critic["brain_id"] == brain["brain_id"]
          assert critic["source_hash"] == ai["source_hash"]
          assert critic["status"] in {"pass", "review", "blocked"}
          assert critic["summary"]["by_severity"]["CRITICAL"] == 0, critic
          reconciliation = ai["campaign_reconciliation"]
          assert reconciliation["schema_version"] == 1
          assert reconciliation["reconciliation_id"].startswith("reconciliation-v1:")
          assert reconciliation["campaign_id"] == campaign_id
          assert reconciliation["source_hash"] == ai["source_hash"] == brain["source_hash"] == critic["source_hash"]
          assert reconciliation["brain_id"] == brain["brain_id"] == critic["brain_id"]
          assert reconciliation["critic_id"] == critic["critic_id"]
          assert reconciliation["status"] in {"resolved", "review", "blocked"}
          assert all(rule["evidence_ids"] and rule["source_references"] for rule in reconciliation["rules"]), reconciliation["rules"]
          critic_finding_ids = {item["finding_id"] for item in critic["findings"]}
          reconciled_finding_ids = {item["finding_id"] for item in reconciliation["findings"]}
          assert critic_finding_ids == reconciled_finding_ids, (critic_finding_ids, reconciled_finding_ids)
          unresolved_ids = {item["finding_id"] for item in reconciliation["findings"] if item["status"] == "unresolved"}
          represented_unresolved_ids = {item.get("critic_finding_id") for item in reconciliation["conflicts"] if item.get("critic_finding_id")}
          assert unresolved_ids.issubset(represented_unresolved_ids), (unresolved_ids, represented_unresolved_ids)
          contract = ai["evidence_contract"]
          assert contract["schema_version"] == 1
          assert contract["coverage"] == 1.0, contract
          assert contract["unverified"] == [], contract["unverified"]
          rules = ai["rules"]
          assert isinstance(rules, dict)  # legacy ai_rules.rules projection stays available
          assert rules["cta_required"] is True
          assert rules["cta_text"] == "Follow and meet Ryan for more @....."
          assert "@ryan.zofay" in rules["handles"]
          assert "@ryanzofay" in rules["handles"]
          assert "@thezofayexperiencepodcast" in rules["handles"]
          assert "#RyanZofay" in rules["hashtags"]
          assert "#ryanzofayexperiencepodcast" in rules["hashtags"]
          # The bounded sync is intentionally not a publishing/Buffer workflow.
          assert os.getenv("CLIPPER_AUTO_QUEUE", "0") in {"0", "false", "no", ""}

          print("PRODUCTION_ACCEPTANCE=PASS")
          print("RECONCILIATION_STATUS="+str(reconciliation["status"]))
          print("RECONCILED_RULES="+str(len(reconciliation["rules"])))
          print("RECONCILED_FINDINGS="+str(len(reconciliation["findings"])))
          print("UNRESOLVED_FINDINGS="+str(len(unresolved_ids)))
          print("BUFFER_PUBLISHING_MUTATION=NONE")
          print("SCHEMA_VERSION="+str(ai["schema_version"]))
          print("EVIDENCE_COVERAGE="+str(contract["coverage"]))
          print("VERIFIED_EVIDENCE="+str(len(contract["verified"])))
          print("UNVERIFIED_EVIDENCE="+str(len(contract["unverified"])))
          print("CTA_RETAINED="+str(rules["cta_required"]))
          print("HANDLES_RETAINED="+str(len(rules["handles"])))
          print("HASHTAGS_RETAINED="+str(len(rules["hashtags"])))
          print("CRITIC_STATUS="+str(critic["status"]))
          print("CRITIC_FINDINGS="+str(critic["summary"]["finding_count"]))
          PY
