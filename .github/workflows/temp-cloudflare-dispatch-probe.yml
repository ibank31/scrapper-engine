name: TEMP Cloudflare Dispatch Probe

on:
  issues:
    types: [opened]

jobs:
  probe:
    if: contains(github.event.issue.title, 'E2E Drive Intake Retest')
    runs-on: ubuntu-latest
    steps:
      - name: Call production dispatch endpoint
        run: |
          set -o pipefail
          curl --fail-with-body -sS -i \
            -X POST \
            -H 'content-type: application/json' \
            https://clipper-engine.pages.dev/api/jobs/cd9a876b-1de3-4e40-a9d1-2978f5ed1b81/run \
            | tee /tmp/dispatch-response.txt
      - name: Print response
        if: always()
        run: cat /tmp/dispatch-response.txt || true
