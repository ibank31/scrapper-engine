name: TEMP Cloudflare Dispatch Probe

on:
  issues:
    types: [opened]

jobs:
  probe:
    if: contains(github.event.issue.title, 'E2E Cloudflare Dispatch Probe')
    runs-on: ubuntu-latest
    steps:
      - name: Call production dispatch endpoint
        run: |
          set -o pipefail
          curl --fail-with-body -sS -i \
            -X POST \
            -H 'content-type: application/json' \
            https://clipper-engine.pages.dev/api/jobs/67f038a7-1b8b-45c6-8187-525694d11e2b/run \
            | tee /tmp/dispatch-response.txt
      - name: Print response
        if: always()
        run: cat /tmp/dispatch-response.txt || true
