name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run deterministic regression suite
        env:
          CLIPPER_SEMANTIC_ENABLED: "false"
        run: python -m unittest discover -s tests -v
      - name: Evaluate semantic golden fixture
        env:
          CLIPPER_SEMANTIC_ENABLED: "false"
        run: python scripts/evaluate_semantic_fixture.py --out semantic-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-semantic-evaluation
          path: semantic-evaluation.json
      - run: node --check cloudflare/api.js
      - run: node --check web/app.js
