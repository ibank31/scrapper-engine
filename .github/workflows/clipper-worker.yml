name: clipper-worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "Cloudflare job ID"
        required: true
        type: string
      campaign_id:
        description: "Campaign ID"
        required: true
        type: string

concurrency:
  group: clipper-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Sync live Content Rewards campaigns
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
        run: python worker/sync_campaigns.py
      - name: Run clipping pipeline
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: python worker/run_job.py
