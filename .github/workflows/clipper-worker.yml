name: clipper-worker

on:
  # Drain queued jobs without human click (free path).
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "Cloudflare job ID (optional — empty = ambil satu job queued)"
        required: false
        type: string
        default: ""

concurrency:
  # One runner at a time for free-tier safety.
  group: clipper-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # Free path target: under ~15–20 minutes wall time for typical campaign assets.
    # Hard stop at 35 minutes so a hung download/transcribe never burns a full hour.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache faster-whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-int8-v1
          restore-keys: |
            whisper-base-int8-
            whisper-

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run clipping pipeline
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          PYTHONPATH: ${{ github.workspace }}
          # Fast free defaults for GitHub-hosted CPU runners
          CLIPPER_WHISPER_MODEL: base
          CLIPPER_WHISPER_BEAM: "1"
          CLIPPER_MAX_VIDEO_SOURCES: "1"
          CLIPPER_FFMPEG_PRESET: veryfast
          CLIPPER_FFMPEG_CRF: "23"
        run: python worker/run_job.py
