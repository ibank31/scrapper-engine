name: clipper-worker

on:
  push:
    branches:
      - main
  # Clipping runs only when started manually from the homepage.
  workflow_dispatch:
    inputs:
      job_id:
        description: "Cloudflare job ID (optional — empty = ambil satu job queued)"
        required: false
        type: string
        default: ""
      dispatch_token:
        description: "Internal atomic dispatch claim token"
        required: false
        type: string
        default: ""

concurrency:
  # Serialize retries for the same manually started job.
  group: clipper-worker-${{ inputs.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # Quality-first path: allow three sources and small Whisper to finish cleanly.
    # Hard stop at 55 minutes so a hung download/transcribe is still bounded.
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache faster-whisper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/clipper-semantic
          key: whisper-and-qwen-semantic-v1
          restore-keys: |
            whisper-and-qwen-semantic-
            whisper-base-int8-
            whisper-

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install optional local semantic ranker
        run: |
          python -m pip install -r requirements-semantic.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id="Qwen/Qwen2.5-1.5B-Instruct-GGUF",
              filename="qwen2.5-1.5b-instruct-q4_k_m.gguf",
              local_dir="/home/runner/.cache/clipper-semantic",
          )
          PY

      - name: Run clipping pipeline
        env:
          CLIPPER_API_URL: ${{ secrets.CLIPPER_API_URL }}
          CLIPPER_WORKER_TOKEN: ${{ secrets.CLIPPER_WORKER_TOKEN }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DRIVE_MAX_FILES: "3"
          JOB_ID: ${{ inputs.job_id }}
          CLIPPER_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          PYTHONPATH: ${{ github.workspace }}
          # Trial default: process the best official source for predictable latency.
          CLIPPER_WHISPER_MODEL: small
          CLIPPER_WHISPER_BEAM: "3"
          CLIPPER_MAX_VIDEO_SOURCES: "1"
          CLIPPER_FFMPEG_PRESET: medium
          CLIPPER_FFMPEG_CRF: "19"
          CLIPPER_SEMANTIC_MODEL: /home/runner/.cache/clipper-semantic/qwen2.5-1.5b-instruct-q4_k_m.gguf
          CLIPPER_SEMANTIC_ENABLED: "auto"
          CLIPPER_SEMANTIC_THREADS: "4"
        run: python worker/run_job.py
